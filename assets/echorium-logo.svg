<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Echorium Productions logo</title>
  <desc id="desc">White Echorium wordmark over a purple to blue gradient field.</desc>
  <defs>
    <linearGradient id="echoriumGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8d4cff"/>
      <stop offset="0.46" stop-color="#7278f2"/>
      <stop offset="1" stop-color="#48d7d5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#echoriumGradient)"/>
  <g fill="#fff" font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif" font-weight="500" letter-spacing="-6">
    <text x="600" y="244" text-anchor="middle" font-size="110">echo</text>
    <text x="600" y="334" text-anchor="middle" font-size="110">rium</text>
  </g>
</svg>
